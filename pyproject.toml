[project]
name = "cifraflow"
version = "1.0.0"
description = "Leitor de letras e cifras para músicos que acompanha a música pela voz"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maurício Castro", email = "contato@mactecnology.com.br" }]
dependencies = [
    "PyQt6>=6.6",
    "sounddevice>=0.4",
    "numpy>=1.24",
    "SpeechRecognition>=3.10",
]

[project.urls]
Homepage = "https://mactecnology.com.br"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.spec", "build", "dist"]

[tool.ruff.lint]
# E/W: estilo PEP 8 · F: erros reais (pyflakes) · I: ordem de imports
# B: armadilhas comuns (bugbear) · UP: sintaxe moderna
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
